name: Keep-alive Takata Kwetu (anti-veille Render)

# Maintient l application eveillee 24/7 sur le plan gratuit Render
# (le plan gratuit met le service en veille apres ~15 min sans trafic).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application Takata Kwetu
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 https://takata-app.onrender.com/api/health || true)
            echo "Tentative $i : HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Takata Kwetu en ligne"
              exit 0
            fi
            sleep 10
          done
          echo "Application injoignable apres 6 tentatives" >&2
          exit 1
