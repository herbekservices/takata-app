<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Takata Kwetu</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #fff; color: #171A17;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .logo { width: 64px; height: 64px; border-radius: 4px; background: #F0F7F2; border: 1px solid #D5E5DA;
            display: grid; place-items: center; font-size: 30px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 300; letter-spacing: .2em; color: #1B7A3D; margin: 0 0 8px; }
    p { color: #6B726B; font-size: 14px; text-align: center; margin: 0 24px; }
    code { background: #F4F5F3; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="logo">♻️</div>
  <h1>Takata Kwetu</h1>
  <p>Cet écran de secours s'affiche lorsque l'URL du serveur n'est pas configurée.</p>
  <p>Éditez <code>capacitor.config.json</code> → <code>server.url</code> avec l'adresse du serveur Takata Kwetu<br>(ex. <code>http://192.168.1.10:8080</code>), puis relancez&nbsp;: <code>npx cap sync android</code>.</p>
</body>
</html>
