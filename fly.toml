# Takata Kwetu — déploiement Fly.io (alternative à Render)
app = "takata-app"
primary_region = "cdg"   # Paris (proche RDC/Europe) ; alternatives : jnb (Johannesburg)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TAKATA_DATA_DIR = "/data"
  TAKATA_DB = "/data/takata.db"
  TRUST_PROXY = "1"

[mounts]
  source = "takata_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
